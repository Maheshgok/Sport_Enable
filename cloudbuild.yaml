# GCP Cloud Build Configuration
# Automatically builds and deploys to Cloud Run when code is pushed to main branch

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/moove-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/moove-api:latest'
      - '-f'
      - 'cloud-run/Dockerfile'
      - '.'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/moove-api:$SHORT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=cloud-run/'
      - '--image=gcr.io/$PROJECT_ID/moove-api:$SHORT_SHA'
      - '--location=asia-south1'
      - '--namespace=default'

  # Step 4: Alternative: Deploy to Cloud Run directly
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--service=moove-api'
      - '--image=gcr.io/$PROJECT_ID/moove-api:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/moove-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/moove-api:latest'

# Build timeout (30 minutes)
timeout: '1800s'

# Only build on push to main branch
branches:
  only:
    - main

# Substitutions for Cloud Run deployment
substitutions:
  _REGION: 'asia-south1'
  _SERVICE_NAME: 'moove-api'
  _PLATFORM: 'managed'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
