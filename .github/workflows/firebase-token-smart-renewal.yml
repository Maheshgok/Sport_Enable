name: Firebase Token Smart Renewal (Multi-Channel)

on:
  schedule:
    # Check every 15 days for more frequent alerts
    - cron: '0 9 1,15 * *'  # 1st and 15th of every month
  workflow_dispatch:

jobs:
  smart-token-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Calculate days since token creation
      - name: Calculate Token Age
        id: token-age
        run: |
          # Get the last commit that mentions "Firebase token"
          LAST_TOKEN_UPDATE=$(git log --all --format=%cs --grep="Firebase\|token" -- "FIREBASE_TOKEN_RENEWAL.md" "*.md" | head -1)
          
          if [ -z "$LAST_TOKEN_UPDATE" ]; then
            LAST_TOKEN_UPDATE=$(git log --all --format=%cs -- ".github/workflows/firebase*" | head -1)
          fi
          
          if [ -z "$LAST_TOKEN_UPDATE" ]; then
            echo "TOKEN_UPDATE_DATE=unknown" >> $GITHUB_OUTPUT
            echo "DAYS_SINCE=0" >> $GITHUB_OUTPUT
            echo "ALERT_LEVEL=UNKNOWN" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          CREATION_EPOCH=$(date -d "$LAST_TOKEN_UPDATE" +%s 2>/dev/null || date -jf "%Y-%m-%d" "$LAST_TOKEN_UPDATE" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_SINCE=$(( ($NOW_EPOCH - $CREATION_EPOCH) / 86400 ))
          
          echo "TOKEN_UPDATE_DATE=$LAST_TOKEN_UPDATE" >> $GITHUB_OUTPUT
          echo "DAYS_SINCE=$DAYS_SINCE" >> $GITHUB_OUTPUT
          
          # Determine alert level based on days
          if [ $DAYS_SINCE -ge 85 ]; then
            echo "ALERT_LEVEL=CRITICAL" >> $GITHUB_OUTPUT
            echo "DAYS_REMAINING=$((90 - $DAYS_SINCE))" >> $GITHUB_OUTPUT
          elif [ $DAYS_SINCE -ge 75 ]; then
            echo "ALERT_LEVEL=WARNING" >> $GITHUB_OUTPUT
            echo "DAYS_REMAINING=$((90 - $DAYS_SINCE))" >> $GITHUB_OUTPUT
          elif [ $DAYS_SINCE -ge 60 ]; then
            echo "ALERT_LEVEL=INFO" >> $GITHUB_OUTPUT
            echo "DAYS_REMAINING=$((90 - $DAYS_SINCE))" >> $GITHUB_OUTPUT
          else
            echo "ALERT_LEVEL=OK" >> $GITHUB_OUTPUT
            echo "DAYS_REMAINING=$((90 - $DAYS_SINCE))" >> $GITHUB_OUTPUT
          fi

      # Send Slack notification
      - name: Notify Slack (All Levels)
        uses: slackapi/slack-github-action@v1
        if: steps.token-age.outputs.ALERT_LEVEL != 'OK' && steps.token-age.outputs.ALERT_LEVEL != 'UNKNOWN'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🔑 Firebase Token Status Alert",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🔑 Firebase Token Status"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Alert Level:*\n${{ steps.token-age.outputs.ALERT_LEVEL }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Days Since Creation:*\n${{ steps.token-age.outputs.DAYS_SINCE }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Days Until Expiry:*\n${{ steps.token-age.outputs.DAYS_REMAINING }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Last Updated:*\n${{ steps.token-age.outputs.TOKEN_UPDATE_DATE }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Action Required:*\n1. Run: `firebase login:ci --project=watch-mail-trial --no-localhost`\n2. Copy token\n3. Update GitHub Secret `FIREBASE_TOKEN`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View on GitHub"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      # Send Email notification (if configured)
      - name: Send Email Alert (Critical Only)
        uses: dawidd6/action-send-mail@v3
        if: steps.token-age.outputs.ALERT_LEVEL == 'CRITICAL' && secrets.EMAIL_USERNAME != ''
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🚨 CRITICAL: Firebase Token Expires in ${{ steps.token-age.outputs.DAYS_REMAINING }} Days'
          to: ${{ secrets.ALERT_EMAIL }}
          from: 'GitHub Actions <noreply@github.com>'
          body: |
            🚨 CRITICAL ALERT
            
            Your Firebase CI token will expire in ${{ steps.token-age.outputs.DAYS_REMAINING }} days!
            
            Token created: ${{ steps.token-age.outputs.TOKEN_UPDATE_DATE }}
            Days since creation: ${{ steps.token-age.outputs.DAYS_SINCE }}
            
            IMMEDIATE ACTION REQUIRED:
            1. Run locally: firebase login:ci --project=watch-mail-trial --no-localhost
            2. Copy the generated token
            3. Update GitHub Secret 'FIREBASE_TOKEN' with the new token
            4. Re-run failed deployment workflows
            
            Without renewal, deployments will fail in ${{ steps.token-age.outputs.DAYS_REMAINING }} days.
            
            GitHub Actions Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Create GitHub issue (Warning and Critical levels)
      - name: Create GitHub Issue (if needed)
        uses: actions/github-script@v7
        if: steps.token-age.outputs.ALERT_LEVEL == 'WARNING' || steps.token-age.outputs.ALERT_LEVEL == 'CRITICAL'
        with:
          script: |
            const alertLevel = '${{ steps.token-age.outputs.ALERT_LEVEL }}';
            const daysSince = '${{ steps.token-age.outputs.DAYS_SINCE }}';
            const daysRemaining = '${{ steps.token-age.outputs.DAYS_REMAINING }}';
            
            let emoji = '⚠️';
            let priority = 'medium';
            if (alertLevel === 'CRITICAL') {
              emoji = '🚨';
              priority = 'high';
            }
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${emoji} Firebase Token Renewal Required (${daysRemaining} days remaining)`,
              body: `## Firebase Token Status\n\n- **Alert Level:** ${alertLevel}\n- **Days Since Creation:** ${daysSince}\n- **Days Until Expiry:** ${daysRemaining}\n- **Created:** ${{ steps.token-age.outputs.TOKEN_UPDATE_DATE }}\n\n## Action Required\n\nYour Firebase CI token is expiring soon!\n\n### Steps to Renew\n\n1. Run locally:\n   \`\`\`bash\n   firebase login:ci --project=watch-mail-trial --no-localhost\n   \`\`\`\n\n2. Copy the generated token from the terminal\n\n3. Update GitHub Secret:\n   - Go to: https://github.com/${{ github.repository }}/settings/secrets/actions\n   - Click **FIREBASE_TOKEN**\n   - Update value with new token\n   - Click **Save**\n\n4. Re-run failed deployments:\n   - Go to: https://github.com/${{ github.repository }}/actions\n   - Click \"Deploy to Firebase Hosting\"\n   - Click \"Run workflow\"\n\n5. Close this issue once renewed\n\n## Why This Matters\n\nWithout renewal, deployments will fail and the frontend cannot be updated. Token expiration is non-negotiable.\n\n## Related\n\n- 📖 [Token Management Guide](https://github.com/${{ github.repository }}/blob/main/FIREBASE_TOKEN_RENEWAL.md)\n- 🔗 [GitHub Secrets](https://github.com/${{ github.repository }}/settings/secrets/actions)`,
              labels: ['🔑 maintenance', '🔥 firebase', priority === 'high' ? '🚨 critical' : '⚠️ warning'],
              assignees: [] // Leave unassigned for team visibility
            });

      # Summary output
      - name: Print Summary
        run: |
          echo "## Firebase Token Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Alert Level | ${{ steps.token-age.outputs.ALERT_LEVEL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Created | ${{ steps.token-age.outputs.TOKEN_UPDATE_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Days Since Creation | ${{ steps.token-age.outputs.DAYS_SINCE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Days Until Expiry | ${{ steps.token-age.outputs.DAYS_REMAINING }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.token-age.outputs.ALERT_LEVEL }}" != "OK" ]; then
            echo "### ⚠️ Action Required" >> $GITHUB_STEP_SUMMARY
            echo "Follow renewal steps in created GitHub issue" >> $GITHUB_STEP_SUMMARY
          fi
